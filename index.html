<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordwall Bot</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .card {
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 12px;
            padding: 2rem;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        h1 { text-align: center; font-size: 1.8rem; margin-bottom: 1.5rem; color: #e94560; }
        label { display: block; margin-bottom: 0.3rem; font-size: 0.9rem; color: #aaa; }
        .label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.3rem; }
        .label-row label { margin-bottom: 0; }
        .max-badge {
            font-size: 0.78rem;
            border-radius: 6px;
            padding: 2px 8px;
            display: none;
        }
        .max-badge.loading { color: #64b5f6; background: rgba(100,181,246,0.12); border: 1px solid rgba(100,181,246,0.3); display: inline-block; }
        .max-badge.ready   { color: #4caf50; background: rgba(76,175,80,0.12);    border: 1px solid rgba(76,175,80,0.3);  display: inline-block; }
        .max-badge.error   { color: #e94560; background: rgba(233,69,96,0.12);    border: 1px solid rgba(233,69,96,0.3);  display: inline-block; }
        input {
            width: 100%;
            padding: 0.6rem 0.8rem;
            margin-bottom: 1rem;
            background: #0f3460;
            border: 1px solid #1a4a7a;
            border-radius: 8px;
            color: #eee;
            font-size: 1rem;
        }
        input:focus { outline: none; border-color: #e94560; }
        button {
            width: 100%;
            padding: 0.8rem;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #c73652; }
        button:disabled { background: #555; cursor: not-allowed; }
        #log {
            margin-top: 1.2rem;
            background: #0a0a1a;
            border-radius: 8px;
            padding: 0.8rem;
            max-height: 220px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
            display: none;
        }
        .log-success { color: #4caf50; }
        .log-error   { color: #e94560; }
        .log-info    { color: #64b5f6; }
        #progress { margin-top: 0.8rem; font-size: 0.9rem; text-align: center; color: #aaa; display: none; }
    </style>
</head>
<body>
<div class="card">
    <h1>🤖 Wordwall Bot</h1>

    <label>Wordwall URL</label>
    <input type="text" id="url" placeholder="https://wordwall.net/play/12345/..." oninput="onUrlChange()">

    <label>Bot Name</label>
    <input type="text" id="name" placeholder="BotName">

    <label>Number of Bots (max 200)</label>
    <input type="number" id="botCount" placeholder="10" min="1" max="200">

    <div class="label-row">
        <label>Score</label>
        <span class="max-badge loading" id="maxBadge">fetching max...</span>
    </div>
    <input type="number" id="score" placeholder="1000">

    <label>Time (seconds)</label>
    <input type="number" id="time" placeholder="30">

    <button id="runBtn" onclick="runBots()">🚀 Run Bots</button>
    <div id="progress"></div>
    <div id="log"></div>
</div>

<script>
    const LEADERBOARD_URL = "https://wordwall.net/leaderboardajax/addentry";
    const CORS = "https://corsproxy.io/?";

    let debounceTimer = null;
    let lastFetchedUrl = "";

    function proxied(url) {
        return CORS + encodeURIComponent(url);
    }

    async function getPageData(url) {
        const res = await fetch(proxied(url));
        const html = await res.text();
        const match = html.match(/window\.pageData\s*=\s*(\{.*?\});/);
        if (!match) throw new Error("Could not find window.pageData on the page.");
        return JSON.parse(match[1]);
    }

    function getActivityId(url) {
        return parseInt(url.split("/")[5]);
    }

    async function fetchMaxScore(url) {
        const badge = document.getElementById("maxBadge");
        try {
            const data = await getPageData(url);
            const contentUrl = `https://user.cdn.wordwall.net/content-models/${data.authorUserId}/${data.activityGuid}.xml`;
            const res = await fetch(proxied(contentUrl));
            if (!res.ok) throw new Error(`XML fetch failed (${res.status})`);
            const xml = await res.text();
            const doc = new DOMParser().parseFromString(xml, "text/xml");
            const count = doc.querySelectorAll("item").length;
            badge.className = "max-badge ready";
            badge.textContent = `max: ${count}`;
        } catch (e) {
            badge.className = "max-badge error";
            badge.textContent = "max: unavailable";
        }
    }

    function onUrlChange() {
        const url = document.getElementById("url").value.trim();
        const badge = document.getElementById("maxBadge");
        badge.className = "max-badge";
        clearTimeout(debounceTimer);
        if (!url.includes("wordwall.net")) return;
        badge.className = "max-badge loading";
        badge.textContent = "fetching max...";
        debounceTimer = setTimeout(() => {
            if (url !== lastFetchedUrl) {
                lastFetchedUrl = url;
                fetchMaxScore(url);
            }
        }, 800);
    }

    function log(msg, type = "info") {
        const logDiv = document.getElementById("log");
        logDiv.style.display = "block";
        const line = document.createElement("div");
        line.className = `log-${type}`;
        line.textContent = msg;
        logDiv.appendChild(line);
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    function setProgress(current, total) {
        const p = document.getElementById("progress");
        p.style.display = "block";
        p.textContent = `Progress: ${current} / ${total}`;
    }

    async function sendBot(name, score, time, activityId, templateId) {
        const payload = new URLSearchParams({ score, time: time * 1000, name, mode: 1, activityId, templateId });
        const res = await fetch(proxied(LEADERBOARD_URL), {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: payload.toString()
        });
        return res.status === 200;
    }

    async function runBots() {
        const url      = document.getElementById("url").value.trim();
        const name     = document.getElementById("name").value.trim();
        const botCount = parseInt(document.getElementById("botCount").value);
        const score    = parseInt(document.getElementById("score").value);
        const time     = parseInt(document.getElementById("time").value);

        document.getElementById("log").innerHTML = "";
        document.getElementById("log").style.display = "none";
        document.getElementById("progress").style.display = "none";

        if (!url || !name || !botCount || !score || !time) { log("Please fill in all fields!", "error"); return; }
        if (botCount > 200) { log("Bot count must be 200 or less!", "error"); return; }

        const btn = document.getElementById("runBtn");
        btn.disabled = true;
        btn.textContent = "Running...";

        try {
            log("Fetching page data...", "info");
            const data = await getPageData(url);
            const templateId = String(data.templateId);
            const activityId = getActivityId(url);
            log(`✅ templateId: ${templateId} | activityId: ${activityId}`, "success");

            for (let i = 0; i < botCount; i++) {
                const botName = botCount === 1 ? name : `${name}_${i}`;
                const ok = await sendBot(botName, score, time, activityId, templateId);
                log(ok ? `[+] Bot ${i+1} (${botName}) submitted successfully` : `[-] Bot ${i+1} (${botName}) failed`, ok ? "success" : "error");
                setProgress(i + 1, botCount);
                if (botCount > 1) await new Promise(r => setTimeout(r, 100));
            }
            log(`✅ Done! ${botCount} bot(s) submitted.`, "success");
        } catch (e) {
            log("❌ Error: " + e.message, "error");
        }

        btn.disabled = false;
        btn.textContent = "🚀 Run Bots";
    }
</script>
</body>
</html>
