<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordwall Bot</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 12px;
            padding: 2rem;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        h1 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            color: #e94560;
        }
        label {
            display: block;
            margin-bottom: 0.3rem;
            font-size: 0.9rem;
            color: #aaa;
        }
        input {
            width: 100%;
            padding: 0.6rem 0.8rem;
            margin-bottom: 1rem;
            background: #0f3460;
            border: 1px solid #1a4a7a;
            border-radius: 8px;
            color: #eee;
            font-size: 1rem;
        }
        input:focus { outline: none; border-color: #e94560; }
        button {
            width: 100%;
            padding: 0.8rem;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #c73652; }
        button:disabled { background: #555; cursor: not-allowed; }
        #log {
            margin-top: 1.2rem;
            background: #0a0a1a;
            border-radius: 8px;
            padding: 0.8rem;
            max-height: 220px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
            display: none;
        }
        .log-success { color: #4caf50; }
        .log-error { color: #e94560; }
        .log-info { color: #64b5f6; }
        #progress {
            margin-top: 0.8rem;
            font-size: 0.9rem;
            text-align: center;
            color: #aaa;
            display: none;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>🤖 Wordwall Bot</h1>

    <label>Wordwall URL</label>
    <input type="text" id="url" placeholder="https://wordwall.net/play/12345/...">

    <label>Bot Name</label>
    <input type="text" id="name" placeholder="BotName">

    <label>Number of Bots (max 200)</label>
    <input type="number" id="botCount" placeholder="10" min="1" max="200">

    <label>Score</label>
    <input type="number" id="score" placeholder="1000">

    <label>Time (seconds)</label>
    <input type="number" id="time" placeholder="30">

    <button id="runBtn" onclick="runBots()">🚀 Run Bots</button>

    <div id="progress"></div>
    <div id="log"></div>
</div>

<script>
    const LEADERBOARD_URL = "https://wordwall.net/leaderboardajax/addentry";
    const CORS_PROXY = "https://corsproxy.io/?";

    function log(msg, type = "info") {
        const logDiv = document.getElementById("log");
        logDiv.style.display = "block";
        const line = document.createElement("div");
        line.className = `log-${type}`;
        line.textContent = msg;
        logDiv.appendChild(line);
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    function setProgress(current, total) {
        const p = document.getElementById("progress");
        p.style.display = "block";
        p.textContent = `Progress: ${current} / ${total}`;
    }

    async function getTemplateId(url) {
        try {
            const response = await fetch(CORS_PROXY + encodeURIComponent(url));
            const html = await response.text();
            const match = html.match(/s\.templateId=Number\((\d+)\)/);
            if (!match) throw new Error("Could not find templateId on the page.");
            return match[1];
        } catch (e) {
            throw new Error("Failed to fetch page: " + e.message);
        }
    }

    function getActivityId(url) {
        const parts = url.split("/");
        return parseInt(parts[5]);
    }

    async function sendBot(name, score, time, activityId, templateId) {
        const payload = new URLSearchParams({
            score: score,
            time: time * 1000,
            name: name,
            mode: 1,
            activityId: activityId,
            templateId: templateId
        });

        const response = await fetch(CORS_PROXY + encodeURIComponent(LEADERBOARD_URL), {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: payload.toString()
        });

        return response.status === 200;
    }

    async function runBots() {
        const url = document.getElementById("url").value.trim();
        const name = document.getElementById("name").value.trim();
        const botCount = parseInt(document.getElementById("botCount").value);
        const score = parseInt(document.getElementById("score").value);
        const time = parseInt(document.getElementById("time").value);

        document.getElementById("log").innerHTML = "";
        document.getElementById("log").style.display = "none";
        document.getElementById("progress").style.display = "none";

        if (!url || !name || !botCount || !score || !time) {
            log("Please fill in all fields!", "error");
            return;
        }
        if (botCount > 200) {
            log("Bot count must be 200 or less!", "error");
            return;
        }

        const btn = document.getElementById("runBtn");
        btn.disabled = true;
        btn.textContent = "Running...";

        try {
            log(`Fetching templateId from page...`, "info");
            const templateId = await getTemplateId(url);
            const activityId = getActivityId(url);
            log(`✅ templateId: ${templateId} | activityId: ${activityId}`, "success");

            if (botCount === 1) {
                const success = await sendBot(name, score, time, activityId, templateId);
                if (success) {
                    log(`[+] Bot 1 (${name}) submitted successfully`, "success");
                } else {
                    log(`[-] Bot 1 (${name}) failed`, "error");
                }
                setProgress(1, 1);
            } else {
                for (let i = 0; i < botCount; i++) {
                    const botName = `${name}_${i}`;
                    const success = await sendBot(botName, score, time, activityId, templateId);
                    if (success) {
                        log(`[+] Bot ${i + 1} (${botName}) submitted successfully`, "success");
                    } else {
                        log(`[-] Bot ${i + 1} (${botName}) failed`, "error");
                    }
                    setProgress(i + 1, botCount);
                    await new Promise(r => setTimeout(r, 100));
                }
            }

            log(`✅ Done! ${botCount} bots submitted.`, "success");
        } catch (e) {
            log("❌ Error: " + e.message, "error");
        }

        btn.disabled = false;
        btn.textContent = "🚀 Run Bots";
    }
</script>
</body>
</html>
